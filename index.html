<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>РАЗБОРКА</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #111; font-family: monospace; }
    #app { width: 100%; height: 100%; }
    canvas { display: block; }
    #vignette {
      position: fixed; inset: 0; pointer-events: none;
      box-shadow: inset 0 0 180px 40px rgba(180,0,0,0);
      transition: box-shadow 200ms; z-index: 50;
    }
    #flash {
      position: fixed; inset: 0; pointer-events: none;
      background: #f00; opacity: 0; z-index: 60;
      transition: opacity 400ms;
    }
    #loading {
      position: fixed; inset: 0; display: flex;
      align-items: center; justify-content: center;
      flex-direction: column; color: #eee; z-index: 100;
      background: radial-gradient(circle, #1a1410 0%, #0a0705 100%);
    }
    .spinner {
      width: 60px; height: 60px; border: 4px solid #333;
      border-top-color: #f33; border-radius: 50%;
      animation: spin 1s linear infinite; margin-bottom: 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading .status { color: #aaa; font-size: 13px; margin-top: 8px; }
    #error {
      display: none; position: fixed; inset: 0;
      z-index: 200; background: #1a0a0a; color: #f88;
      padding: 30px; overflow: auto; font-size: 13px;
    }
    #error h2 { color: #f44; margin-top: 0; }
    #error pre {
      background: #000; padding: 12px; border-radius: 4px;
      white-space: pre-wrap; word-break: break-word;
      max-height: 50vh; overflow: auto;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
    }
  }
  </script>
</head>
<body>
  <div id="app"></div>
  <div id="vignette"></div>
  <div id="flash"></div>

  <div id="loading">
    <div class="spinner"></div>
    <div>Загрузка...</div>
    <div class="status" id="load-status">инициализация</div>
  </div>

  <div id="error">
    <h2>Ошибка загрузки</h2>
    <div id="error-body"></div>
    <p>Открой консоль браузера (<b>F12</b> → Console) и посмотри подробности.</p>
    <p>Что можно попробовать:</p>
    <ul>
      <li>Обнови страницу (Ctrl+F5)</li>
      <li>Проверь интернет</li>
      <li>Открой в Chrome / Firefox / Edge последней версии</li>
      <li>Отключи блокировщики рекламы (могут резать CDN)</li>
    </ul>
    <button onclick="location.reload()" style="padding:10px 20px;background:#f33;color:#fff;border:none;cursor:pointer;font:14px monospace;margin-top:16px">Перезагрузить</button>
  </div>

  <script>
    // Watchdog: если через 30с приложение не готово — показать ошибку
    window.__app_ready = false;
    window.__log = function(msg) {
      console.log('%c[RAZBORKA]%c ' + msg, 'color:#f33;font-weight:bold', 'color:#aaa');
      const el = document.getElementById('load-status');
      if (el) el.textContent = msg;
    };
    function showError(title, body) {
      console.error('[RAZBORKA ERROR]', title, body);
      const err = document.getElementById('error');
      const ld = document.getElementById('loading');
      if (err) {
        err.style.display = 'block';
        document.getElementById('error-body').innerHTML =
          '<b>' + title + '</b><pre>' + (body && body.stack || body || '') + '</pre>';
      }
      if (ld) ld.style.display = 'none';
    }
    window.__showError = showError;

    setTimeout(function() {
      if (!window.__app_ready) {
        showError(
          'Приложение не запустилось за 30 секунд',
          'Скорее всего один из CDN (jsdelivr/esm.sh) не загрузился.\n' +
          'Проверь вкладку Network в DevTools (F12) — какие запросы висят красным.\n\n' +
          'Или в Console есть ошибка — пришли её текст.'
        );
      }
    }, 30000);

    // Ловим ошибки импорта на уровне window
    window.addEventListener('error', function(e) {
      if (!window.__app_ready && e.message) {
        console.error('[RAZBORKA] window error:', e.message, e.filename, e.lineno);
      }
    });
    window.addEventListener('unhandledrejection', function(e) {
      if (!window.__app_ready) {
        console.error('[RAZBORKA] unhandled rejection:', e.reason);
      }
    });
  </script>
  <script type="module" src="./main.js"></script>
</body>
</html>
