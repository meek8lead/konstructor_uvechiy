<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Mutilation Constructor</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; background: #000; font-family: monospace; color: #fff; }
  canvas { display: block; }
  #hud {
    position: fixed; top: 12px; left: 12px; font-size: 15px; line-height: 1.5;
    z-index: 10; pointer-events: none; text-shadow: 1px 1px 2px #000;
  }
  #hud .bar { width: 180px; height: 8px; background: #300; border: 1px solid #800; margin-top: 3px; }
  #hud .bar > div { height: 100%; background: #0c0; transition: width 0.15s; }
  #crosshair {
    position: fixed; top: 50%; left: 50%; width: 12px; height: 12px;
    margin: -6px 0 0 -6px; border: 2px solid #fff; border-radius: 50%;
    pointer-events: none; opacity: 0.6; z-index: 9;
  }
  #crosshair.grab { border-color: #f80; opacity: 1; transform: scale(1.3); }
  #menu {
    position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 20;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    cursor: pointer; text-align: center;
  }
  #menu h1 { font-size: 42px; color: #f33; letter-spacing: 4px; text-shadow: 0 0 20px #f00; }
  #menu p { margin-top: 20px; font-size: 18px; }
  #menu .small { margin-top: 40px; font-size: 13px; opacity: 0.6; line-height: 1.8; }
  #msg {
    position: fixed; top: 30%; left: 50%; transform: translateX(-50%);
    font-size: 28px; color: #f33; text-shadow: 0 0 15px #f00;
    z-index: 15; pointer-events: none; opacity: 0; transition: opacity 0.4s;
  }
</style>
</head>
<body>

<div id="menu">
  <h1>MUTILATION CONSTRUCTOR</h1>
  <p>Кликни, чтобы начать</p>
  <div class="small">
    WASD — движение &nbsp;|&nbsp; Мышь — обзор<br>
    ЛКМ / ПКМ — схватить клешнёй &nbsp;|&nbsp; Q — бросить<br>
    Удерживай захват — конечность оторвётся
  </div>
</div>

<div id="hud">
  <div>КОРПУС <span id="hp">100</span></div>
  <div class="bar"><div id="hpbar" style="width:100%"></div></div>
  <div style="margin-top:10px">ВОЛНА <span id="wave">0</span></div>
  <div>УБИЙСТВ <span id="kills">0</span></div>
</div>
<div id="crosshair"></div>
<div id="msg"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "@dimforge/rapier3d-compat": "https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.11.2/rapier.es.js"
  }
}
</script>
<script type="module" src="main.js"></script>
</body>
</html>
